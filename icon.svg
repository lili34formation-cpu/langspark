<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="face" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Headphone band -->
  <path d="M 90 240 Q 256 100 422 240" stroke="#3b0764" stroke-width="32" fill="none" stroke-linecap="round"/>
  <!-- Headphone pads -->
  <circle cx="90"  cy="258" r="48" fill="#3b0764"/>
  <circle cx="90"  cy="258" r="30" fill="#7c3aed"/>
  <circle cx="422" cy="258" r="48" fill="#3b0764"/>
  <circle cx="422" cy="258" r="30" fill="#7c3aed"/>
  <!-- Head -->
  <circle cx="256" cy="262" r="170" fill="url(#face)"/>
  <!-- Shine -->
  <ellipse cx="200" cy="190" rx="60" ry="40" fill="rgba(255,255,255,.12)" transform="rotate(-25 200 190)"/>
  <!-- Eyes white -->
  <ellipse cx="196" cy="255" rx="50" ry="54" fill="#e0e7ff"/>
  <ellipse cx="316" cy="255" rx="50" ry="54" fill="#e0e7ff"/>
  <!-- Pupils -->
  <circle cx="204" cy="262" r="30" fill="#1a1a2e"/>
  <circle cx="214" cy="252" r="11" fill="white"/>
  <circle cx="324" cy="262" r="30" fill="#1a1a2e"/>
  <circle cx="334" cy="252" r="11" fill="white"/>
  <!-- Smile -->
  <path d="M 186 320 Q 256 372 326 320" stroke="white" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="136" cy="305" r="36" fill="#f472b6" opacity=".35"/>
  <circle cx="376" cy="305" r="36" fill="#f472b6" opacity=".35"/>
  <!-- Star -->
  <text x="224" y="190" font-size="64" fill="#fbbf24" text-anchor="middle">✦</text>
</svg>
